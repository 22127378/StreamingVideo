# Gateway khi chạy local (docker compose): một cổng 4000 chia /api/* về từng service,
# giống cách ALB Ingress chia đường dẫn trên EKS.
server {
  listen 4000;
  client_max_body_size 1m;
  resolver 127.0.0.11 valid=10s;

  set $account  http://account:4000;
  set $upload   http://upload:4000;
  set $catalog  http://catalog:4000;
  set $playback http://playback:4000;
  set $live     http://live:4000;

  location /api/auth/     { proxy_pass $account; }
  location /api/uploads   { proxy_pass $upload; }
  location /api/videos    { proxy_pass $catalog; }
  location /api/playback/ { proxy_pass $playback; }
  location /api/live/     { proxy_pass $live; }

  # /internal/* (catalog, live) chỉ dùng trong mạng nội bộ, không mở qua gateway
  location / { return 404 '{"success":false,"message":"Route not found"}'; }

  location = /health { return 200 '{"status":"UP","service":"gateway"}'; }
}
