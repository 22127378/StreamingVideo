# KEDA đọc độ dài queue bằng quyền của chính operator (Pod Identity role "keda")
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: streamforge-aws
  namespace: streamforge
spec:
  podIdentity:
    provider: aws
---
# Worker transcode chạy dưới dạng KEDA ScaledJob: mỗi message SQS do một Kubernetes Job xử lý,
# pod xử lý đúng 1 video rồi thoát. Khác Deployment + ScaledObject ở chỗ không bao giờ bị scale down
# khi đang transcode dở (HPA xoá pod bất kỳ), nên video dài không phải làm lại từ đầu.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: streamforge-worker
  namespace: streamforge
  labels:
    app: streamforge-worker
spec:
  jobTargetRef:
    # Không retry Job tại chỗ: message quay lại queue và Job mới nhận (SQS tính số lần thử)
    backoffLimit: 0
    # Video tối đa 30 phút; một job chạy quá 1 giờ coi như treo
    activeDeadlineSeconds: 3600
    template:
      metadata:
        labels:
          app: streamforge-worker
        annotations:
          # Karpenter không thu hồi node khi pod đang transcode
          karpenter.sh/do-not-disrupt: "true"
      spec:
        # Job: process thoát là xong, không khởi động lại tại chỗ. Lỗi transcode được thử lại qua SQS.
        restartPolicy: Never
        serviceAccountName: streamforge-worker
        # Lớn hơn SHUTDOWN_GRACE_SECONDS (25s) để worker kịp trả message về queue
        terminationGracePeriodSeconds: 40
        nodeSelector:
          streamforge.io/pool: transcode
        tolerations:
          - key: streamforge.io/workload
            operator: Equal
            value: transcode
            effect: NoSchedule
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            image: streamforge-worker
            ports:
              # Prometheus scrape (PodMonitor ở k8s/monitoring/app-monitors.yaml)
              - name: metrics
                containerPort: 9464
            envFrom:
              - configMapRef:
                  name: streamforge-config
            env:
              - name: SERVICE_NAME
                value: worker
              # Mỗi pod xử lý tối đa 1 video rồi thoát; chờ message tối đa 5 phút
              - name: WORKER_MODE
                value: job
              - name: JOB_IDLE_TIMEOUT_SECONDS
                value: "300"
              # User DB của worker (SELECT/UPDATE trên videos), đăng nhập bằng token IAM
              - name: DB_USER
                value: streamforge_worker
            resources:
              requests:
                cpu: 1500m
                memory: 2Gi
                ephemeral-storage: 10Gi
              limits:
                memory: 3Gi
                ephemeral-storage: 20Gi
            volumeMounts:
              - name: temp
                mountPath: /app/temp
              - name: tmp
                mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        volumes:
          # File tải về và output HLS
          - name: temp
            emptyDir:
              sizeLimit: 20Gi
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
  # Provisioned: luôn có sẵn 1 Job đang chờ message (và 1 máy Spot) để video đầu tiên không phải chờ
  # cấp máy (~55-75s). Job chờ quá JOB_IDLE_TIMEOUT_SECONDS thì thoát và KEDA tạo Job mới thay.
  # Overlay đặt lại theo WORKER_MIN_REPLICAS của k8s/deploy.sh; 0 = không giữ Job nào khi rảnh.
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 15
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  # Cập nhật ScaledJob (deploy bản mới) không xoá các Job đang chạy, chúng làm xong với image cũ
  rollout:
    strategy: gradual
  scalingStrategy:
    # Số Job cần tạo = số message (kể cả đang xử lý) - số Job đang chạy. Job đang chờ cũng được tính,
    # nên 1 message mới đến khi đã có Job chờ sẵn thì không tạo thêm.
    strategy: default
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: streamforge-aws
      metadata:
        # queueURL do overlay điền
        queueURL: REPLACED_BY_OVERLAY
        awsRegion: us-east-1
        # Mỗi Job xử lý 1 message
        queueLength: "1"
        scaleOnInFlight: "true"
