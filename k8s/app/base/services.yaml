# Bốn service HTTP của StreamForge. Mỗi service có ServiceAccount (IAM role riêng qua Pod Identity),
# Deployment, Service và PodDisruptionBudget. ALB Ingress (ingress.yaml) chia /api/* theo đường dẫn.
# Service không gọi database của nhau; dữ liệu đi qua sự kiện EventBridge (xem src/shared/src/events.js).
---
# account: Đăng nhập, gói, nâng cấp Premium (Cognito)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamforge-account
  namespace: streamforge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-account
  namespace: streamforge
  labels:
    app: streamforge-account
    streamforge.io/tier: http
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamforge-account
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: streamforge-account
        streamforge.io/tier: http
    spec:
      serviceAccountName: streamforge-account
      # Pod Identity gắn token riêng (eks-pod-identity-token), pod không gọi Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: account
          image: streamforge-account
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: streamforge-config
          env:
            - name: SERVICE_NAME
              value: account
            # CloudFront + ALB đứng trước service
            - name: TRUST_PROXY_HOPS
              value: "2"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: streamforge-account
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: streamforge-account
  namespace: streamforge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: streamforge-account
---
apiVersion: v1
kind: Service
metadata:
  name: streamforge-account
  namespace: streamforge
  labels:
    app: streamforge-account
    # ServiceMonitor (k8s/monitoring/app-monitors.yaml) chọn mọi Service có nhãn này
    streamforge.io/tier: http
spec:
  selector:
    app: streamforge-account
  ports:
    - name: http
      port: 80
      targetPort: http
---
