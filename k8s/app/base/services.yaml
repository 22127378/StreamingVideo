# playback: Kiểm tra quyền xem, cấp CloudFront signed cookies, phát VideoViewed
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamforge-playback
  namespace: streamforge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-playback
  namespace: streamforge
  labels:
    app: streamforge-playback
    streamforge.io/tier: http
  annotations:
    checkov.io/skip1: CKV_K8S_35=The signing key is read once at startup from a Secret; the env var is never logged
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamforge-playback
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: streamforge-playback
        streamforge.io/tier: http
    spec:
      serviceAccountName: streamforge-playback
      # Pod Identity gắn token riêng (eks-pod-identity-token), pod không gọi Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playback
          image: streamforge-playback
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: streamforge-config
          env:
            - name: SERVICE_NAME
              value: playback
            # CloudFront + ALB đứng trước service
            - name: TRUST_PROXY_HOPS
              value: "2"
            # Hỏi catalog thông tin video qua API nội bộ (/internal), trong cụm
            - name: CATALOG_URL
              value: http://streamforge-catalog
            # Ký CloudFront signed cookies cho /videos/*
            - name: CLOUDFRONT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: streamforge-cloudfront
                  key: private_key
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: streamforge-playback
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: streamforge-playback
  namespace: streamforge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: streamforge-playback
---
apiVersion: v1
kind: Service
metadata:
  name: streamforge-playback
  namespace: streamforge
  labels:
    app: streamforge-playback
    # ServiceMonitor (k8s/monitoring/app-monitors.yaml) chọn mọi Service có nhãn này
    streamforge.io/tier: http
spec:
  selector:
    app: streamforge-playback
  ports:
    - name: http
      port: 80
      targetPort: http
