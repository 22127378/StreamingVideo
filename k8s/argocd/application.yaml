# ArgoCD theo dõi thư mục k8s/gitops/dev trên nhánh main và đồng bộ lên namespace streamforge.
# Thứ tự trong một lần sync (annotation sync-wave trong k8s/gitops/dev):
#   -3 namespace, -2 ConfigMap và ServiceAccount của migration,
#   -1 Job migration (hook Sync: chạy lại mỗi lần sync, phải xong thì mới sang bước sau),
#    0 API, worker (ScaledJob), Service, Ingress.
# Secret (JWT, private key CloudFront) không nằm trong Git: k8s/deploy.sh tạo trực tiếp trên cụm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamforge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/22127378/StreamingVideo.git
    targetRevision: main
    path: k8s/gitops/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: streamforge
  syncPolicy:
    automated:
      # Xoá tài nguyên đã bị bỏ khỏi Git, và sửa lại khi có người đổi tay trên cụm
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
