# Migration database: mỗi service có schema và user riêng (catalog, upload, live), chạy bằng image của chính service.
# Chạy trước khi rollout app: hook Sync của ArgoCD (wave -1), hoặc k8s/deploy.sh khi chưa có ArgoCD.
# ServiceAccount có Pod Identity đọc mật khẩu master (Secrets Manager).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamforge-db-migrator
  namespace: streamforge
---
apiVersion: batch/v1
kind: Job
metadata:
  name: streamforge-migrate-catalog
  namespace: streamforge
  labels:
    app: streamforge-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: streamforge-migrate
    spec:
      serviceAccountName: streamforge-db-migrator
      # Pod Identity gắn token riêng (eks-pod-identity-token), pod không gọi Kubernetes API
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: streamforge-catalog
          command: ["node", "src/migrate.js"]
          envFrom:
            - configMapRef:
                name: streamforge-config
            - configMapRef:
                name: streamforge-db-migrate
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
