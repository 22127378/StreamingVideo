# ALB do EKS Auto Mode quản lý (không cần cài AWS Load Balancer Controller)
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
  # Mọi Ingress lớp "alb" (API, Grafana) dùng chung một ALB. EKS Auto Mode khai báo nhóm ở đây;
  # annotation alb.ingress.kubernetes.io/group.name bị bỏ qua.
  group:
    name: streamforge
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
