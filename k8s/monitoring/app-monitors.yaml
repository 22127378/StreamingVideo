# Prometheus scrape /metrics của 4 service HTTP (qua Service có nhãn streamforge.io/tier=http)
# và worker (trực tiếp pod, cổng 9464). Mỗi Service thành một job riêng: streamforge-<service>.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: streamforge-services
  namespace: streamforge
spec:
  selector:
    matchLabels:
      streamforge.io/tier: http
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: streamforge-worker
  namespace: streamforge
spec:
  selector:
    matchLabels:
      app: streamforge-worker
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      # Pod Job chỉ nán lại METRICS_LINGER_SECONDS (15s) sau khi xong, nên scrape dày hơn
      interval: 10s
---
# KEDA operator: metric về scaler (lỗi đọc SQS, giá trị độ dài queue)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: keda-operator
  namespace: keda
spec:
  selector:
    matchLabels:
      app: keda-operator
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
