# Cảnh báo của StreamForge: Prometheus -> Alertmanager -> SNS -> email.
# Cảnh báo về SQS và CloudFront nằm ở CloudWatch (terraform/layers/observability) để vẫn chạy khi cụm lỗi.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: streamforge
  namespace: monitoring
spec:
  groups:
    - name: streamforge-api
      rules:
        # Mỗi service HTTP (account, upload, catalog, playback, live) phải có ít nhất một pod trả lời
        - alert: StreamForgeServiceDown
          expr: |
            sum by (job) (up{namespace="streamforge", job=~"streamforge-(account|upload|catalog|playback|live)"}) < 1
            or label_replace(absent(up{job="streamforge-account"}), "job", "streamforge-account", "", "")
            or label_replace(absent(up{job="streamforge-upload"}), "job", "streamforge-upload", "", "")
            or label_replace(absent(up{job="streamforge-catalog"}), "job", "streamforge-catalog", "", "")
            or label_replace(absent(up{job="streamforge-playback"}), "job", "streamforge-playback", "", "")
            or label_replace(absent(up{job="streamforge-live"}), "job", "streamforge-live", "", "")
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.job }}: không pod nào trả lời Prometheus trong 5 phút"
            description: "Kiểm tra kubectl -n streamforge get pods -l app={{ $labels.job }} và log của service đó trong Grafana."

        # Catalog không xử lý được sự kiện (lỗi lặp lại hoặc sự kiện của video không tồn tại)
        - alert: StreamForgeCatalogEventErrors
          expr: sum(increase(streamforge_catalog_events_total{outcome="error"}[15m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "Catalog gặp {{ $value | humanize }} lỗi khi xử lý sự kiện trong 15 phút"
            description: 'Sự kiện lỗi quá 10 lần sẽ vào DLQ streamforge-dev-catalog-events-dlq. Log: {namespace="streamforge", service="catalog"} |= "[events]"'

        - alert: StreamForgeApiHigh5xxRate
          expr: |
            sum(rate(streamforge_http_request_duration_seconds_count{status=~"5.."}[5m]))
              / sum(rate(streamforge_http_request_duration_seconds_count[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Hơn 5% request API lỗi 5xx ({{ $value | humanizePercentage }})"

        - alert: StreamForgeApiSlow
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(streamforge_http_request_duration_seconds_bucket{route!="unmatched"}[5m]))) > 1.5
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "p95 thời gian xử lý của API là {{ $value | humanizeDuration }} (ngưỡng 1.5s)"

    - name: streamforge-transcode
      rules:
        - alert: StreamForgeTranscodeFailed
          # Mỗi pod (Job) xử lý 1 video nên counter chỉ đi từ 0 lên 1 và pod biến mất ngay sau đó:
          # increase() không thấy được. max_over_time đếm số pod có kết quả này trong 15 phút.
          expr: sum(max_over_time(streamforge_transcode_jobs_total{outcome=~"failed|rejected"}[15m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "{{ $value | humanize }} video transcode thất bại hoặc bị từ chối trong 15 phút"
            description: 'Trong Grafana Explore (Loki): {namespace="streamforge", event="transcode_finished"} | json'

        - alert: StreamForgeWorkerUnavailable
          # Worker là ScaledJob về 0 khi rảnh, nên "không có Job" chỉ là lỗi khi có video đang chờ.
          # Độ dài queue lấy từ KEDA (trigger aws-sqs-queue; scaleOnInFlight nên gồm cả message đang xử lý).
          expr: |
            max(keda_scaler_metrics_value{namespace="streamforge", metric=~".*aws-sqs.*"}) > 0
              and on()
            (sum(kube_job_status_active{namespace="streamforge", job_name=~"streamforge-worker-.+"}) or vector(0)) < 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Có {{ $value | humanize }} video chờ trong queue nhưng không có Job worker nào chạy trong 10 phút"
            description: Thường do không xin được máy Spot hoặc KEDA không tạo được Job. Xem kubectl get nodeclaims, kubectl -n streamforge describe scaledjob streamforge-worker và sự kiện Kubernetes trong Loki.

    - name: streamforge-platform
      rules:
        - alert: StreamForgePodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"streamforge|keda|monitoring"}[15m]) > 3
          labels: { severity: warning }
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restart {{ $value | humanize }} lần trong 15 phút"

        - alert: StreamForgeScrapeTargetDown
          expr: up{namespace=~"streamforge|keda"} == 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Prometheus không scrape được {{ $labels.job }} ({{ $labels.instance }})"
