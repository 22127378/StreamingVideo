# Loki chế độ single binary: một pod, dữ liệu trên S3 (bucket của terraform/layers/observability).
# Tên bucket do install.sh truyền qua --set. Quyền S3 qua EKS Pod Identity (ServiceAccount "loki").
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    s3:
      region: us-east-1
  limits_config:
    retention_period: 336h # 14 ngày, khớp lifecycle của bucket
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: s3
  pattern_ingester:
    enabled: false

serviceAccount:
  create: true
  name: loki

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: auto-ebs-sc
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

# Các thành phần cho chế độ phân tán và cache: không dùng ở quy mô này
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
