name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: shared
          - service: account-service
          - service: upload-service
            db: { user: streamforge_upload, schema: upload }
          - service: catalog-service
            db: { user: streamforge_catalog, schema: catalog }
          - service: playback-service
          - service: transcode-worker
    defaults:
      run:
        working-directory: src/${{ matrix.service }}
    # PostgreSQL cho test tích hợp của upload và catalog (mỗi service chạy migration của schema mình)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: streamforge
          POSTGRES_PASSWORD: streamforge
          POSTGRES_DB: streamforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json

      # Worker dùng ffmpeg của hệ điều hành, giống Docker image
      - name: Install ffmpeg
        if: matrix.service == 'transcode-worker'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci
      - run: npm test
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
          DB_TEST: ${{ matrix.db && '1' || '' }}
          DB_USER: ${{ matrix.db.user }}
          DB_SCHEMA: ${{ matrix.db.schema }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high

  frontend:
    name: Build frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6

      - name: Format
        run: terraform fmt -check -recursive terraform

      - name: Validate layers
        run: |
          for layer in terraform/layers/*/; do
            echo "::group::$layer"
            terraform -chdir="$layer" init -backend=false -input=false
            terraform -chdir="$layer" validate
            echo "::endgroup::"
          done

  checkov:
    name: Checkov (Terraform and Kubernetes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.4.5

      # Quyết định chung nằm trong .checkov.yaml; ngoại lệ từng tài nguyên ghi ngay tại tài nguyên
      - name: Scan Terraform
        run: checkov --config-file .checkov.yaml -d terraform --framework terraform

      # Quét manifest đã render như lúc deploy: overlay tạm gắn tag image bằng commit SHA
      # (base để trống tag, overlay của repo cấu hình mới đặt tag)
      - name: Scan Kubernetes manifests
        run: |
          mkdir -p ci-overlay rendered
          {
            echo "resources: [../k8s/app/base, ../k8s/db]"
            echo "images:"
            for img in account upload catalog playback worker; do
              echo "  - { name: streamforge-$img, newTag: \"$GITHUB_SHA\" }"
            done
          } > ci-overlay/kustomization.yaml
          kubectl kustomize ci-overlay > rendered/all.yaml
          checkov --config-file .checkov.yaml -d rendered --framework kubernetes

  image:
    name: Build and scan ${{ matrix.service }} image
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: account, dockerfile: docker/service.Dockerfile, build-args: SERVICE=account-service }
          - { service: upload, dockerfile: docker/service.Dockerfile, build-args: SERVICE=upload-service }
          - { service: catalog, dockerfile: docker/service.Dockerfile, build-args: SERVICE=catalog-service }
          - { service: playback, dockerfile: docker/service.Dockerfile, build-args: SERVICE=playback-service }
          - { service: worker, dockerfile: docker/worker.Dockerfile, build-args: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          # Context là src/ để image copy được package dùng chung src/shared
          context: src
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          tags: streamforge-${{ matrix.service }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Fail khi image có lỗ hổng HIGH/CRITICAL đã có bản vá
      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            streamforge-${{ matrix.service }}:${{ github.sha }}
