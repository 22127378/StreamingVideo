name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, transcode-worker]
    defaults:
      run:
        working-directory: src/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json

      # Worker dùng ffmpeg của hệ điều hành, giống Docker image
      - name: Install ffmpeg
        if: matrix.service == 'transcode-worker'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci
      - run: npm test
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6

      - name: Format
        run: terraform fmt -check -recursive terraform

      - name: Validate layers
        run: |
          for layer in terraform/layers/*/; do
            echo "::group::$layer"
            terraform -chdir="$layer" init -backend=false -input=false
            terraform -chdir="$layer" validate
            echo "::endgroup::"
          done

  image:
    name: Build and scan ${{ matrix.service }} image
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: src/api
            dockerfile: docker/api.Dockerfile
          - service: worker
            context: src/transcode-worker
            dockerfile: docker/worker.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: streamforge-${{ matrix.service }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Fail khi image có lỗ hổng HIGH/CRITICAL đã có bản vá
      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            streamforge-${{ matrix.service }}:${{ github.sha }}
