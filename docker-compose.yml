services:
  localstack:
    container_name: streamforge-localstack
    image: localstack/localstack:4.4 # bản mới hơn yêu cầu LOCALSTACK_AUTH_TOKEN
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # External service port range
    environment:
      - SERVICES=s3,sqs,events
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=1
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "./scripts/init-aws-local.sh:/etc/localstack/init/ready.d/init-aws-local.sh"
      - "./scripts/cors-config.json:/tmp/cors-config.json"
    healthcheck:
      # Healthy khi init script (tạo bucket, queue, event bus) đã chạy xong
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - streamforge-network

  # PostgreSQL thay Aurora khi chạy local (đăng nhập bằng mật khẩu thay vì IAM)
  postgres:
    container_name: streamforge-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: streamforge
      POSTGRES_DB: streamforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - streamforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - streamforge-network

  # Migration: mỗi service có schema và user riêng (giống Job migration trên EKS)
  migrate-catalog:
    profiles: ["app"]
    container_name: streamforge-migrate-catalog
    build: &catalog-build
      context: ./src
      dockerfile: ../docker/service.Dockerfile
      args: { SERVICE: catalog-service }
    command: ["node", "src/migrate.js"]
    environment: &db-env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: streamforge
      DB_SSL: "false"
      DB_PASSWORD: streamforge
      DB_MASTER_USER: streamforge
      DB_MASTER_PASSWORD: streamforge
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streamforge-network

  migrate-upload:
    profiles: ["app"]
    container_name: streamforge-migrate-upload
    build: &upload-build
      context: ./src
      dockerfile: ../docker/service.Dockerfile
      args: { SERVICE: upload-service }
    command: ["node", "src/migrate.js"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streamforge-network

  migrate-live:
    profiles: ["app"]
    container_name: streamforge-migrate-live
    build: &live-build
      context: ./src
      dockerfile: ../docker/service.Dockerfile
      args: { SERVICE: live-service }
    command: ["node", "src/migrate.js"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streamforge-network

  # Các service chạy trong container: docker compose --profile app up -d --build
  # Không có profile thì chỉ LocalStack và PostgreSQL khởi động (để chạy service bằng npm trên máy).
  account:
    profiles: ["app"]
    container_name: streamforge-account
    build:
      context: ./src
      dockerfile: ../docker/service.Dockerfile
      args: { SERVICE: account-service }
    environment: &app-env
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      EVENT_BUS_NAME: streamforge-local
      # Image chạy NODE_ENV=production nên cần secret >= 32 ký tự. Chỉ dùng cho local.
      JWT_SECRET: local-compose-secret-not-for-production-use
      # LocalStack không có Cognito: đăng nhập bằng email + chọn gói (POST /api/auth/dev-login)
      ALLOW_DEV_AUTH: "true"
    networks:
      - streamforge-network

  upload:
    profiles: ["app"]
    container_name: streamforge-upload
    build: *upload-build
    environment:
      <<: [*app-env, *db-env]
      DB_USER: streamforge_upload
      DB_SCHEMA: upload
      # Presigned URL do trình duyệt gọi nên dùng localhost
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:4566
      AWS_S3_FORCE_PATH_STYLE: "true"
      S3_RAW_UPLOADS_BUCKET: streamforge-raw-uploads
      S3_PROCESSED_BUCKET: streamforge-processed
    depends_on:
      localstack:
        condition: service_healthy
      migrate-upload:
        condition: service_completed_successfully
    networks:
      - streamforge-network

  catalog:
    profiles: ["app"]
    container_name: streamforge-catalog
    build: *catalog-build
    environment:
      <<: [*app-env, *db-env]
      DB_USER: streamforge_catalog
      DB_SCHEMA: catalog
      AWS_S3_FORCE_PATH_STYLE: "true"
      S3_RAW_UPLOADS_BUCKET: streamforge-raw-uploads
      S3_PROCESSED_BUCKET: streamforge-processed
      CDN_BASE_URL: http://localhost:4566/streamforge-processed
      CATALOG_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/streamforge-catalog-events
    depends_on:
      localstack:
        condition: service_healthy
      migrate-catalog:
        condition: service_completed_successfully
    networks:
      - streamforge-network

  playback:
    profiles: ["app"]
    container_name: streamforge-playback
    build:
      context: ./src
      dockerfile: ../docker/service.Dockerfile
      args: { SERVICE: playback-service }
    environment:
      <<: *app-env
      CATALOG_URL: http://catalog:4000
      CDN_BASE_URL: http://localhost:4566/streamforge-processed
    networks:
      - streamforge-network

  # Phát trực tiếp: kênh, đăng ký, bình luận. Luồng video đi qua MediaMTX (thay Amazon IVS khi local).
  live:
    profiles: ["app"]
    container_name: streamforge-live
    build: *live-build
    environment:
      <<: [*app-env, *db-env]
      DB_USER: streamforge_live
      DB_SCHEMA: live
      LIVE_PROVIDER: local
      # OBS và trình duyệt chạy trên máy nên dùng localhost; API của MediaMTX gọi trong mạng compose
      LIVE_LOCAL_INGEST_URL: rtmp://localhost:1935/live
      LIVE_LOCAL_PLAYBACK_BASE_URL: http://localhost:8888/live
      LIVE_LOCAL_API_URL: http://mediamtx:9997
    depends_on:
      migrate-live:
        condition: service_completed_successfully
    networks:
      - streamforge-network

  mediamtx:
    profiles: ["app"]
    container_name: streamforge-mediamtx
    image: bluenviron/mediamtx:1.9.3
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:1935:1935" # RTMP từ OBS
      - "127.0.0.1:8888:8888" # HLS cho trình duyệt
    networks:
      - streamforge-network

  worker:
    profiles: ["app"]
    container_name: streamforge-worker
    build:
      context: ./src
      dockerfile: ../docker/worker.Dockerfile
    environment:
      <<: *app-env
      AWS_S3_FORCE_PATH_STYLE: "true"
      S3_RAW_UPLOADS_BUCKET: streamforge-raw-uploads
      S3_PROCESSED_BUCKET: streamforge-processed
      SQS_TRANSCODE_QUEUE_URL: http://localstack:4566/000000000000/streamforge-transcode-queue
    # Lớn hơn SHUTDOWN_GRACE_SECONDS (25s) để worker kịp trả message về queue
    stop_grace_period: 40s
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - streamforge-network

  # Một cổng cho frontend: chia /api/* về từng service (trên EKS là ALB Ingress)
  gateway:
    profiles: ["app"]
    container_name: streamforge-gateway
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./docker/gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [account, upload, catalog, playback, live]
    networks:
      - streamforge-network

networks:
  streamforge-network:
    name: streamforge-network
    driver: bridge

volumes:
  streamforge-postgres:
